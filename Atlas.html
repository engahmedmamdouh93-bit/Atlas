<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="atlas-version" content="25">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='-52 -52 104 104'%3E%3Crect x='-52' y='-52' width='104' height='104' rx='22' fill='%230B0A1A' stroke='%232A2550' stroke-width='1'/%3E%3Cpath d='M-28 30 L0 -32 L28 30' fill='none' stroke='%23A78BFA' stroke-width='8' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M-15 12 l5 -9 l5 18 l5 -18 l5 18 l5 -18 l5 9' fill='none' stroke='%23FFB25B' stroke-width='5.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Atlas — Home</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0A1A;--cardrgb:22,19,45;--card:rgba(22,19,45,.55);--blur:12px;--inner:#1D1940;--bd:#2A2550;--bd2:#3A3470;--ac:#6D4AFF;--acl:#A78BFA;--acl2:#B9A6FF;--tx:#EDEBFA;--tx2:#D9D4F5;--mu:#A9A3C9;--mu2:#8F89B3;--track:#262145;--pop:#110E26;--pill:#3B2C8F;--orange:#FFB25B;--green:#3DD68C;--blue:#4F8BFF;--pink:#F0508C;--red:#FF9C8C;--white:#fff;--barrgb:12,11,22;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="light"]{--bg:#EFEBFF;--cardrgb:255,255,255;--inner:#F1EEFF;--bd:#D9D3F5;--bd2:#C6BEEF;--tx:#1A1633;--tx2:#2C2650;--mu:#5B5680;--mu2:#7A74A0;--track:#E2DDF7;--pop:#fff;--pill:#E4DCFF;--white:#1A1633;--barrgb:255,255,255;color-scheme:light}
@media (prefers-color-scheme: light){:root:not([data-theme]){--bg:#0B0A1A}}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth;height:100%}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font:15px/1.5 Manrope,'Segoe UI',system-ui,sans-serif}
button,input,select,textarea{font-family:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--acl2)}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
#bg svg{position:absolute;inset:0;width:100%;height:100%}
#app{position:relative;z-index:1;min-height:100vh;padding:24px 24px 120px;display:flex;gap:24px;align-items:flex-start}
nav{position:sticky;top:24px;flex:0 0 auto;display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 12px;background:var(--card);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--bd);border-radius:24px}
nav .nb{width:56px;height:56px;border-radius:16px;border:0;background:transparent;color:var(--mu);display:flex;align-items:center;justify-content:center}
nav .nb.on{background:var(--ac);color:#fff}
nav .nb:hover:not(.on){background:var(--inner)}
nav .sp{height:90px}
main{flex:999 1 560px;min-width:0;display:flex;flex-direction:column;gap:20px;max-width:1280px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px;padding:8px 8px 4px}
h1{margin:0;font:500 clamp(30px,5vw,46px)/1.1 Outfit,sans-serif;color:var(--white)}
h1 span{color:var(--acl)}
.tag{margin:10px 0 0;font-size:17px;color:var(--mu)}
.clock{text-align:right}
.clock .t{font:300 clamp(48px,8vw,84px)/1 Outfit,sans-serif;color:var(--white);letter-spacing:-1px}
.clock .t small{font:500 22px Outfit,sans-serif;color:var(--acl);margin-left:8px}
.clock .d{margin-top:8px;font-size:17px;color:var(--mu)}
.row{display:flex;flex-wrap:wrap;gap:20px}
section.c{min-width:0;padding:22px;background:var(--card);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--bd);border-radius:22px;position:relative}
.hd{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
h2{margin:0;font-size:18px;font-weight:600}
.hint{font-size:12px;color:var(--mu)}
.btn{height:34px;padding:0 12px;border-radius:10px;border:1px solid var(--bd2);background:var(--inner);font-size:13px;font-weight:600}
.btn.pri{background:var(--ac);border-color:var(--ac);color:#fff}
.btn.dng{color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.ib{width:30px;height:30px;border-radius:8px;border:0;background:transparent;color:var(--mu);font-size:18px;line-height:1;padding:0;flex:0 0 auto}
.ib:hover{background:var(--inner)}
.menu{position:absolute;right:0;top:34px;z-index:15;min-width:220px;padding:6px;background:var(--pop);border:1px solid var(--bd2);border-radius:12px;display:flex;flex-direction:column;box-shadow:0 12px 30px rgba(0,0,0,.35)}
.menu button{text-align:left;padding:10px 12px;border:0;background:transparent;font-size:14px;border-radius:8px}
.menu button:hover{background:var(--inner)}
.menu .q{padding:8px 10px;font-size:13px;line-height:1.4;color:var(--tx2)}
.menu .yn{display:flex;gap:8px;padding:4px 8px 8px}
.rel{position:relative}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:8px;white-space:nowrap;border:1px solid}
.empty{padding:14px;border:1px dashed var(--bd2);border-radius:14px;color:var(--mu);font-size:13.5px}
/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px;text-align:center;font-size:12px}
.cal .w{padding:4px 0;color:var(--mu);font-weight:600}
.cal .x{height:28px;display:flex;align-items:center;justify-content:center;border-radius:14px;position:relative;color:var(--tx2)}
.cal .x.o{color:var(--mu2);opacity:.6}
.cal .x.t{background:var(--ac);color:#fff;font-weight:700}
.cal button.x{border:0;font:inherit;font-size:12px;cursor:pointer;padding:0;background:transparent}
.cal button.x:hover{background:var(--inner)}
.cal button.x.t,.cal button.x.t:hover{background:var(--ac)}
.cal .x i{position:absolute;bottom:1px;width:4px;height:4px;border-radius:2px;background:var(--orange)}
.cn{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.cn button{width:32px;height:32px;border:0;background:transparent;color:var(--mu);border-radius:8px;font-size:18px}
/* schedule */
.ev{display:flex;gap:14px;align-items:center;padding:12px 14px;background:var(--inner);border-radius:14px;margin-bottom:10px}
.ev .tm{font-size:13px;line-height:1.5;color:var(--tx2);min-width:52px}
.ev .tt{font-size:15px;font-weight:600;display:flex;align-items:center;gap:8px}
.ev .tt i{width:7px;height:7px;border-radius:4px;flex:0 0 auto}
.ev .st{font-size:13px;color:var(--mu);margin-top:2px}
/* goals */
.g{position:relative;margin-bottom:14px}
.g .l{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;margin-bottom:6px}
.g .l b{flex:1 1 auto;min-width:0;font-weight:600}
.bar{height:8px;border-radius:4px;background:var(--track);overflow:hidden}
.bar div{height:8px;border-radius:4px}
/* habits */
.hg{display:grid;grid-template-columns:minmax(110px,1.4fr) repeat(7,minmax(28px,1fr));gap:8px 6px;align-items:center}
.hg .dn{text-align:center;font-size:12px;font-weight:600;color:var(--mu)}
.hg .dn.today{color:var(--acl)}
.hg .nm{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;position:relative;min-width:0}
.hg .nm span.n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hg .nm i{width:8px;height:8px;border-radius:4px;flex:0 0 auto}
.hb{height:30px;border-radius:9px;border:1px solid var(--bd2);background:transparent;padding:0}
.hb.on{border-color:transparent}
.note{margin-top:12px;font-size:12.5px;color:var(--mu);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* tasks */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.tabs button{height:36px;padding:0 14px;border-radius:10px;font-size:14px;background:transparent;color:var(--mu);border:1px solid transparent}
.tabs button.on{background:var(--pill);color:var(--white);border-color:var(--ac)}
.tk{display:flex;align-items:center;gap:14px;padding:12px 4px;border-bottom:1px solid var(--track)}
.tk .ck{width:26px;height:26px;flex:0 0 auto;border-radius:13px;border:2px solid var(--mu2);background:transparent;display:flex;align-items:center;justify-content:center;padding:0;color:#fff}
.tk .ck.on{background:var(--ac);border-color:var(--ac)}
.tk .bd{flex:1;min-width:0;text-align:left;border:0;background:transparent;padding:0}
.tk .ti{font-size:15px}
.tk .ti.dn{color:var(--mu2);text-decoration:line-through}
.tk .pj{font-size:12.5px;color:var(--mu)}
.tk .wh{font-size:13px;white-space:nowrap;min-width:64px;text-align:right;color:var(--mu)}
.tk .wh.od{color:var(--orange)}
/* timer */
.tm2{position:relative;width:220px;height:220px;margin:6px auto 0;max-width:100%}
.tm2 svg{width:100%;height:100%}
.tm2 .in{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.tm2 .in button{background:transparent;border:0;display:flex;flex-direction:column;align-items:center;gap:4px;padding:20px;border-radius:50%}
#tmTxt{font:300 48px/1 Outfit,sans-serif;color:var(--white)}
#tmLbl{font-size:12px;color:var(--mu);max-width:110px}
/* lists */
.li{display:flex;align-items:center;gap:12px;padding:12px;background:var(--inner);border-radius:14px;margin-bottom:10px;width:100%;text-align:left;border:0;position:relative}
.li .av{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:0 0 auto}
.li .tx{flex:1;min-width:0}
.li .tx b{display:block;font-size:14.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .tx small{color:var(--mu);font-size:12.5px}
/* chat */
#dim{position:fixed;inset:0;z-index:30;border:0;padding:0}
#bar{position:fixed;left:50%;transform:translateX(-50%);z-index:41;width:min(720px,calc(100% - 32px));height:54px;padding:0 8px;display:flex;align-items:center;gap:8px;border-radius:27px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid #4A3F8C;box-shadow:-50px 0 70px -24px rgba(255,120,60,.55),50px 0 70px -24px rgba(80,120,255,.55),0 10px 30px rgba(0,0,0,.4);bottom:calc(20px + env(safe-area-inset-bottom,0px));transition:bottom .15s}
#bar:not(.open){box-shadow:none;border-color:rgba(74,63,140,.3);backdrop-filter:none;-webkit-backdrop-filter:none}
#bar.open{bottom:calc(132px + env(safe-area-inset-bottom,0px))}
#bar input{flex:1;min-width:0;height:40px;background:transparent;border:0;outline:0;font-size:15px;color:var(--tx)}
#bar .bb{height:36px;border-radius:18px;border:1px solid #3A3470;background:rgba(255,255,255,.04);padding:0 12px;font-size:13px;display:flex;align-items:center;gap:6px;color:var(--tx)}
#bar .bb.sq{width:36px;padding:0;justify-content:center;font-size:18px}
#bar .send{width:42px;height:36px;border-radius:18px;border:0;background:linear-gradient(135deg,#FF8A4C,#6D4AFF 60%,#4F8BFF);color:#fff;display:flex;align-items:center;justify-content:center}
.dot{width:8px;height:8px;border-radius:4px;display:inline-block}
#tm{position:absolute;bottom:60px;left:44px;min-width:230px;padding:6px;background:var(--pop);border:1px solid var(--bd2);border-radius:14px;box-shadow:0 12px 30px rgba(0,0,0,.4)}
#tm button{display:flex;width:100%;align-items:center;gap:10px;text-align:left;padding:9px 10px;border:0;background:transparent;font-size:14px;border-radius:8px}
#tm button:hover{background:var(--inner)}
#tm small{margin-left:auto;color:var(--mu);font-size:12px}
#pop{position:fixed;left:50%;transform:translateX(-50%);z-index:40;width:min(720px,calc(100% - 32px));bottom:calc(196px + env(safe-area-inset-bottom,0px));max-height:min(56vh,560px);overflow:auto;padding:16px;background:rgba(14,12,30,.94);border:1px solid #3A3180;border-radius:22px;box-shadow:0 20px 50px rgba(0,0,0,.5);color:#EDEBFA}
#pop .ph{display:flex;justify-content:space-between;gap:10px;font-size:13px;margin-bottom:10px;color:#A9A3C9}
#pop .ph b{color:#EDEBFA;font-size:14px}
.m{display:flex;margin-bottom:8px}
.m.me{justify-content:flex-end}
.m div{max-width:85%;padding:10px 14px;border-radius:16px;font-size:14.5px;background:#1D1940}
.m.me div{background:#3B2C8F}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.chips button{height:30px;padding:0 12px;border-radius:15px;border:1px solid #6D4AFF;background:transparent;color:#EDEBFA;font-size:13px}
#rc{position:fixed;left:50%;transform:translateX(-50%);z-index:41;width:min(720px,calc(100% - 32px));bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#rc .l{font-size:11px;font-weight:700;letter-spacing:1px;color:#B9A6FF}
#rc button.r{flex:1 1 160px;min-width:0;text-align:left;padding:8px 12px;border-radius:14px;border:1px solid #3A3180;background:rgba(14,12,30,.88);color:#EDEBFA}
#rc button.r b{display:block;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#rc button.r small{color:#A9A3C9;font-size:11.5px}
/* panels */
.panel{position:fixed;z-index:60;top:calc(24px + env(safe-area-inset-top,0px));right:24px;width:min(420px,calc(100% - 32px));max-height:calc(100vh - 48px);overflow:auto;padding:22px;background:var(--pop);border:1px solid var(--bd2);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.panel h3{margin:18px 0 8px;font-size:11.5px;font-weight:700;letter-spacing:1px;color:var(--acl2)}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:12px;font-size:13px;color:var(--mu)}
.fld input,.fld select,.fld textarea{background:var(--inner);border:1px solid var(--bd);border-radius:10px;padding:9px 11px;font-size:14px;color:var(--tx);min-width:0}
.fld textarea{min-height:70px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opts{display:flex;gap:8px;flex-wrap:wrap}
.opts button{padding:8px 12px;border-radius:12px;border:1px solid var(--bd2);background:transparent;font-size:13px}
.opts button.on{background:var(--pill);border-color:var(--ac);color:var(--white)}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:8px 0;font-size:14px}
.sw small{display:block;color:var(--mu);font-size:12px}
.sw button{width:44px;height:26px;border-radius:13px;border:0;background:var(--track);position:relative;flex:0 0 auto}
.sw button i{position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:10px;background:#fff;transition:left .15s}
.sw button.on{background:var(--ac)}.sw button.on i{left:21px}
.sw button:disabled{opacity:.5}
.rg label{display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px}
.rg input[type=range]{width:100%;accent-color:var(--ac)}
#ov{position:fixed;inset:0;z-index:55;background:rgba(6,5,16,.55);backdrop-filter:blur(3px)}
.modal{position:fixed;z-index:60;left:50%;top:calc(50% + env(safe-area-inset-top,0px)/2);transform:translate(-50%,-50%);width:min(520px,calc(100% - 32px));max-height:calc(100vh - 48px);overflow:auto;padding:22px;background:var(--pop);border:1px solid var(--bd2);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.5)}
#toast{position:fixed;z-index:80;top:calc(20px + env(safe-area-inset-top,0px));right:20px;max-width:min(380px,calc(100% - 40px));display:flex;gap:12px;align-items:flex-start;padding:14px 16px;background:var(--pop);border:1px solid var(--ac);border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.45)}
#toast b{display:block;font-size:13px;color:var(--acl2)}
#toast span{font-size:14px}
#nchrome .dragz{position:fixed;top:0;left:0;right:150px;height:22px;z-index:150}
#nchrome .wt{position:fixed;top:4px;left:14px;font-size:12px;color:var(--mu);z-index:151;pointer-events:none}
#nchrome .wc{position:fixed;top:0;right:0;z-index:200;display:flex}
#nchrome .wc button{width:44px;height:30px;border:0;background:transparent;color:var(--mu);font-size:14px;border-radius:0}
#nchrome .wc button:hover{background:var(--inner);color:var(--tx)}
#nchrome .wc .x:hover{background:#E81123;color:#fff}
.popbar{position:fixed;top:3px;left:50%;transform:translateX(-50%);z-index:190;display:flex;gap:8px;align-items:center;background:var(--pop);border:1px solid var(--bd2);border-radius:14px;padding:3px 10px}
.popbar .btn{height:26px;font-size:12px}
body.widget #app{display:block;padding:10px;min-height:100vh}
body.widget nav,body.widget #bar,body.widget #chatlayer,body.widget #bg{display:none!important}
body.widget main{max-width:none;gap:10px}
body.widget [data-a="add"]{display:none}
.wbar{display:flex;align-items:center;gap:8px;padding:2px 4px 8px}
.wbar b{flex:1;font-size:15px}
@media (max-width:760px){#app{flex-direction:column;padding:12px 12px 130px;gap:14px}nav{position:static;flex-direction:row;flex-wrap:wrap;justify-content:center;width:100%;padding:8px;gap:4px}nav .nb{width:44px;height:44px}nav .sp{display:none}section.c{padding:16px}.clock{text-align:left}.panel{right:16px}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"></div>
<div id="app">
<nav aria-label="Main" id="nav"></nav>
<main id="main"></main>
</div>
<div id="chatlayer"></div>
<div id="bar" role="search">
  <span style="position:relative"><button class="bb" id="typeBtn" aria-haspopup="true" aria-expanded="false" data-a="typemenu"></button></span>
 <input id="msg" type="text" placeholder="Ask Atlas anything…" aria-label="Message Atlas" autocomplete="off">
 <button class="bb" aria-label="Voice (later)" title="Voice comes later" disabled><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>Voice</button>
 <button class="send" aria-label="Send to Atlas" data-a="send"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12l16-8-6 16-2-6z"/></svg></button>
</div>
<div id="panels"></div>
<div id="toastbox"></div>
<script>
(function(){
'use strict';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const RZ='Asia/Riyadh';
const WK=/^\/widget\//.test(location.pathname)?location.pathname.split('/')[2]:'';
const POP=WK==='app';
const W=POP?'':WK;
const WID=POP?'app':W;
const NATIVE=!!(window.chrome&&window.chrome.webview);
function nmsg(m){try{window.chrome.webview.postMessage(m)}catch(_){}}
const WT={tasks:'Tasks',today:'Today',habits:'Habits',timer:'Timer',app:'App'};
const uid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function rp(ms){const p={};new Intl.DateTimeFormat('en-CA',{timeZone:RZ,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(ms||Date.now())).forEach(x=>{p[x.type]=x.value});return p}
const todayStr=()=>{const p=rp();return p.year+'-'+p.month+'-'+p.day};
function fmtDate(d){if(!d)return '';const a=d.slice(0,10).split('-').map(Number);const cy=+rp().year;return new Intl.DateTimeFormat('en-US',{timeZone:'UTC',weekday:'short',month:'short',day:'numeric',year:a[0]!==cy?'numeric':undefined}).format(new Date(Date.UTC(a[0],a[1]-1,a[2])))}

setInterval(()=>{if(W){if(U.tm.running){U.tm.rem--;if(U.tm.rem<=0){U.tm.rem=0;U.tm.running=false;toast('Focus session complete. Take a short break.','Focus Timer',true)}paintTimer()}if((U.rc=(U.rc||0)+1)%30===0)renderMain();return}tickClock();U.rc=(U.rc||0)+1;if(U.rc%20===0)checkReminders();if(U.rc%60===0)updPoll();if(U.rec||U.recJob)updRec();if(U.recJob&&U.rc%3===0)pollRec();if(U.rc%300===0&&S.settings.notif.gcal){const k=monthOf(U.mo);fetchMonth(k.y,k.m,true)}if(U.tm.running){U.tm.rem--;if(U.tm.rem<=0){U.tm.rem=0;U.tm.running=false;toast('Focus session complete. Take a short break.','Focus Timer',true)}paintTimer()}
 if(todayStr()!==U.lastDay&&!U.modal)renderMain()},1000);
function migrate(){if(!S.meetings)S.meetings=[];if(!S.mig1){const g=S.goals.find(x=>x.title==='AI Learning'),p=S.projects.find(x=>x.name==='StudioOs');if(g&&p&&!p.goal)p.goal=g.id;S.mig1=true}}
S=load()||seed();migrate();
if(W){startWidget()}else{renderAll();if(POP)startPopup()}
if(NATIVE)nativeChrome();
if(!W)(async()=>{const had=!!load();if(!had){try{const d=await dbDoc();if(d){const s=await d.get();const v=s&&(s.data?s.data():s);if(v&&v.json){const o=JSON.parse(v.json);if(o&&o.tasks){S=o;migrate();renderAll()}}}}catch(_){}}
 ready=true;save();setTimeout(checkReminders,2500);if(S.settings.notif.gcal){const k=monthOf(0);fetchMonth(k.y,k.m,true)}
 if(S.settings.bg==='custom'){try{const u=await idb('r');if(u){U.bgUrl=u;applyLook()}}catch(_){}}})();
})();
